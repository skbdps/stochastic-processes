name: One-off clean-checkout scientific release readback
on:
  push:
    branches: [codex/week8-final-readback-20261031]
    paths: [.github/workflows/week8-final-readback.yml]
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLCONFIGDIR: /tmp/ou-final-readback-mpl
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b6edb85d1e7a21ed19fb54b5c71213ed04703309
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Install recorded numerical environment
        run: python -m pip install -r requirements-lock.txt
      - name: Verify original artifact, seal, complete test evidence and preservation
        run: |
          set -euo pipefail
          unset MKL_NUM_THREADS VECLIB_MAXIMUM_THREADS
          mkdir "$RUNNER_TEMP/week8-final-readback"
          test "$(git rev-parse HEAD)" = b6edb85d1e7a21ed19fb54b5c71213ed04703309
          python -u -m scripts.week8_release_verify --output "$RUNNER_TEMP/week8-final-readback/report.json" 2>&1 | tee "$RUNNER_TEMP/week8-final-readback/readback.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week8-final-clean-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/week8-final-readback/
          retention-days: 60
          if-no-files-found: warn
