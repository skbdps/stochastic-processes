name: Expanded teaching notes

on:
  push:
    branches: [main, docs/expanded-teaching-notes-20260913]
    paths: ['docs/expanded_notes/**', 'stochastic_processes_expanded_notes.html', 'index.html', '.github/workflows/expanded-notes.yml']
  pull_request:
    paths: ['docs/expanded_notes/**', 'stochastic_processes_expanded_notes.html', 'index.html', '.github/workflows/expanded-notes.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expanded-notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - name: Install pinned documentation tooling
        run: |
          python -m pip install -r docs/expanded_notes/requirements.txt
          curl --fail --location --silent --show-error https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-linux-amd64.tar.gz -o "$RUNNER_TEMP/pandoc.tar.gz"
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pandoc-3.1.11.1/bin" >> "$GITHUB_PATH"
      - name: Reproduce the approved HTML and check its exact hash
        run: python docs/expanded_notes/build_notes.py
      - name: Run all 47 mathematical example checks
        run: python docs/expanded_notes/check_mathematics.py
      - name: Install Chromium and check the standalone edition
        run: |
          python -m playwright install --with-deps chromium
          python docs/expanded_notes/check_browser.py
      - name: Retain checked output and validation evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: expanded-notes-${{ github.run_id }}
          retention-days: 14
          path: |
            stochastic_processes_expanded_notes.html
            docs/expanded_notes/stochastic_processes_expanded_notes.md
            docs/expanded_notes/ou_likelihood_examples.py
            docs/expanded_notes/validation/

  commit_generated_edition:
    # Only this explicitly authorized staging branch can write generated files.
    # Pull requests and main-branch checks never execute the write job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/docs/expanded-teaching-notes-20260913'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/expanded-teaching-notes-20260913
      - name: Refuse to overwrite a branch that moved during verification
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/download-artifact@v5
        with:
          name: expanded-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/expanded-notes-checked
      - name: Commit only the verified generated teaching files
        env:
          VERIFIED_DIR: ${{ runner.temp }}/expanded-notes-checked
        run: |
          cp "$VERIFIED_DIR/stochastic_processes_expanded_notes.html" stochastic_processes_expanded_notes.html
          cp "$VERIFIED_DIR/docs/expanded_notes/stochastic_processes_expanded_notes.md" docs/expanded_notes/stochastic_processes_expanded_notes.md
          cp "$VERIFIED_DIR/docs/expanded_notes/ou_likelihood_examples.py" docs/expanded_notes/ou_likelihood_examples.py
          echo '022b791e5bfa4f8b91c4e261b21d77434d46ef2485d3c818f40b665b950b8044  stochastic_processes_expanded_notes.html' | sha256sum --check
          git add -- stochastic_processes_expanded_notes.html docs/expanded_notes/stochastic_processes_expanded_notes.md docs/expanded_notes/ou_likelihood_examples.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs: publish byte-identical expanded teaching edition'
            git push origin HEAD:refs/heads/docs/expanded-teaching-notes-20260913
          fi
