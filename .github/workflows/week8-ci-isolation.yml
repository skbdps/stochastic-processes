name: Correct runner CI process isolation
on:
  push:
    branches: [validation/week8-completion-20261031]
    paths: [.github/workflows/week8-ci-isolation.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Apply reviewed CI-only corrections from saved source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY'];path='.github/workflows/week8-runner.yml';branch='validation/week8-runner-20261031'
          def get(ref):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/contents/{path}?ref={ref}'],text=True))
          original=get('1f98ed1e2d787307c08370e8e33db900cb3448dd');current=get(branch)
          text=base64.b64decode(original['content']).decode()
          old='          python -m pytest -q -ra tests --ignore=tests/week7/test_plots_integrity.py --ignore=tests/week7/test_plots_reference.py --ignore=tests/week7/test_selection.py 2>&1 | tee'
          new='          python -c \'import os; import ou_irregular.runner; import pytest; os.environ.pop("MKL_NUM_THREADS", None); os.environ.pop("VECLIB_MAXIMUM_THREADS", None); raise SystemExit(pytest.main(["-q", "-ra", "tests", "--ignore=tests/week7/test_plots_integrity.py", "--ignore=tests/week7/test_plots_reference.py", "--ignore=tests/week7/test_selection.py"]))\' 2>&1 | tee'
          assert text.count(old)==1;text=text.replace(old,new)
          old="if value is not None:args+=['--method','POST','--input','-']"
          new="if value is not None:args+=['--method','PUT' if path.startswith('contents/') else 'POST','--input','-']"
          assert text.count(old)==1;text=text.replace(old,new)
          text=text.replace("'correction':'CI-only: unset inherited MKL/VECLIB thread settings; run legacy archive fixtures in original minimal environment.","'correction':'CI-only: pre-import historical Week 3 CLI then restore its global thread-environment side effects; run legacy archive fixtures in their original minimal environment.")
          old="assert set(changed)==set(names)|{'.github/workflows/week8-runner.yml'},changed"
          new="assert set(changed)-{n for n in changed if n.startswith('runner-ci-') and n.endswith('.json')}==set(names)|{'.github/workflows/week8-runner.yml'},changed"
          assert text.count(old)==1;text=text.replace(old,new)
          text=text.replace("api('contents/runner-ci-result.json',", "api('contents/runner-ci-result-'+os.environ['GITHUB_RUN_ID']+'.json',")
          marker='      - name: Retain every original output, including failures and hidden lock files\n'
          script="import base64,json,os,pathlib,subprocess; out=pathlib.Path(os.environ['RUNNER_TEMP'])/'week8-runner-ci'; names=['ci_summary.json','test-exit.json','pytest-current.txt','pytest-historical.txt','runner_fixture/stderr.txt','runner_fixture/exit.json']; data={n:(out/n).read_text()[-14000:] for n in names if (out/n).is_file()}; payload={'message':'Record observed runner CI diagnostic','branch':'validation/week8-runner-20261031','content':base64.b64encode((json.dumps(data,indent=2)+'\\n').encode()).decode()}; subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/runner-ci-diagnostic-'+os.environ['GITHUB_RUN_ID']+'.json','--method','PUT','--input','-'],input=json.dumps(payload),text=True,check=True,stdout=subprocess.DEVNULL)"
          step='\n'.join(['      - name: Preserve compact CI diagnostic on validation branch','        if: always()','        env:','          GH_TOKEN: ${{ github.token }}','        run: |',"          python - <<'PYREADBACK'",'          '+script,'          PYREADBACK',''])
          assert text.count(marker)==1;text=text.replace(marker,step+marker)
          payload={'message':'CI: isolate Week 3 import side effects without changing scientific source or tests','branch':branch,'sha':current['sha'],'content':base64.b64encode(text.encode()).decode()}
          result=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/contents/{path}','--method','PUT','--input','-'],input=json.dumps(payload),text=True))
          print('UPDATED_RUNNER_CI='+result['commit']['sha'])
          PY
