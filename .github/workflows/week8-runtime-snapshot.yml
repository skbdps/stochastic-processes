name: Week 8 isolated runtime snapshot
on:
  push:
    branches: [validation/week8-recovery-20261031]
    paths: [.github/workflows/week8-runtime-snapshot.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Install pinned numerical and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Archive only the installed public Python runtime and packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ou-python-runtime"
          prefix="$(python -c 'import sys; print(sys.prefix)')"
          test "$prefix" = '/opt/hostedtoolcache/Python/3.12.14/x64'
          tar --exclude='__pycache__' --exclude='*.pyc' -czf "$RUNNER_TEMP/ou-python-runtime/python312.tar.gz" -C "$prefix" bin lib include share
          python --version > "$RUNNER_TEMP/ou-python-runtime/version.txt"
          python -m pip freeze > "$RUNNER_TEMP/ou-python-runtime/dependencies.txt"
          sha256sum "$RUNNER_TEMP/ou-python-runtime/python312.tar.gz" > "$RUNNER_TEMP/ou-python-runtime/runtime.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: week8-python312-runtime
          path: ${{ runner.temp }}/ou-python-runtime/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
