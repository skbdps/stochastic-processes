name: Week 8 recovery validation
on:
  push:
    branches: [validation/week8-recovery-20261031]
    paths:
      - scripts/week8_recovery_roundoff.patch
      - .github/workflows/week8-recovery-validation.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLCONFIGDIR: /tmp/ou-week8-recovery-mpl
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Install pinned requirements and retain original source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ou-recovery-checks"
          cp tests/week8/test_source.py "$RUNNER_TEMP/ou-recovery-checks/initial_test_source.py"
          python -m pip install -r requirements.txt
          python --version > "$RUNNER_TEMP/ou-recovery-checks/python-version.txt"
          python -m pip freeze > "$RUNNER_TEMP/ou-recovery-checks/dependencies.txt"
      - name: Apply only the declared rational-reference unit-test repair
        run: |
          set -euo pipefail
          git apply --check scripts/week8_recovery_roundoff.patch
          git apply scripts/week8_recovery_roundoff.patch
          git diff --check
          test "$(git diff --name-only)" = 'tests/week8/test_source.py'
          git diff -- tests/week8/test_source.py > "$RUNNER_TEMP/ou-recovery-checks/test-repair.diff"
          cp tests/week8/test_source.py "$RUNNER_TEMP/ou-recovery-checks/test_source.py"
          sha256sum tests/week8/test_source.py ou_irregular/week8/*.py > "$RUNNER_TEMP/ou-recovery-checks/source-hashes.txt"
      - name: Run all Week 8 module tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/week8 | tee "$RUNNER_TEMP/ou-recovery-checks/pytest-week8.txt"
      - name: Upload tested file and logs as unreferenced Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'ou-recovery-checks'
          paths = {'tests/week8/test_source.py': pathlib.Path('tests/week8/test_source.py')}
          paths.update({f'artifacts/week8_development/recovery_20261031/ci_{p.name}': p for p in root.iterdir() if p.is_file()})
          result = {}
          for name, path in sorted(paths.items()):
              content = path.read_bytes()
              request = json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
              response = subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",'--input','-'], input=request, text=True, capture_output=True, check=True)
              result[name] = {'git_blob': json.loads(response.stdout)['sha'], 'sha256': hashlib.sha256(content).hexdigest(), 'bytes': len(content)}
          (root/'uploaded_objects.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Retain checks even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week8-recovery-checks
          path: ${{ runner.temp }}/ou-recovery-checks/
          retention-days: 7
          if-no-files-found: error
