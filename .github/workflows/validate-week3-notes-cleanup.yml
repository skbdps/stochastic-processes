name: Validate Week 3 merge and notes removal

on:
  push:
    branches: [maintenance/validate-week3-notes-cleanup]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Check out the exact proposed merge, not the validation wrapper
        uses: actions/checkout@v6
        with:
          ref: 4513a4b1cafa88560bffef5e267b53fae2ed3fc1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify merge parents, research preservation and notes removal
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          proposed = '4513a4b1cafa88560bffef5e267b53fae2ed3fc1'
          previous_main = 'd58032d5d5e16690cae5d58559d347f4267bcc45'
          week3 = '624275410f2d182c51eb664a52f78703c760a4ce'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == proposed
          assert git('show', '-s', '--format=%P', 'HEAD').split() == [previous_main, week3]
          for parent in (previous_main, week3):
              subprocess.run(['git', 'merge-base', '--is-ancestor', parent, 'HEAD'], check=True)

          source_changes = git('diff', '--name-status', week3, 'HEAD').splitlines()
          expected = ['M\tREADME.md', 'D\tstochastic_processes_for_OU_notes.html']
          assert source_changes == expected, source_changes
          original_readme = git('show', week3 + ':README.md')
          original_note_row = '| `stochastic_processes_for_OU_notes.html` | Original learning notes through P2, supplemented by the derivations document |\n'
          assert original_note_row in original_readme
          assert Path('README.md').read_text().strip() == original_readme.replace(original_note_row, '').strip()

          tracked = git('ls-files').splitlines()
          retired = {
              'stochastic_processes_for_OU_notes.html',
              'stochastic_processes_revision.html',
              'stochastic_processes_expanded_notes.html',
              'index.html',
              'docs/check_revision_examples.py',
              'docs/check_revision_browser.py',
              'docs/revision_validation.md',
              '.github/workflows/revision-notes.yml',
              '.github/workflows/expanded-notes.yml',
          }
          assert not (set(tracked) & retired)
          assert not any(p.startswith('docs/expanded_notes/') for p in tracked)
          removed = git('diff', '--diff-filter=D', '--name-only', previous_main, 'HEAD').splitlines()
          assert all(p in retired or p.startswith('docs/expanded_notes/') for p in removed), removed
          for path in ('ou_irregular', 'tests', 'configs', 'artifacts', 'docs',
                       'notebooks', 'figures', 'results', 'requirements.txt',
                       'requirements-lock.txt', 'run_all.py', 'OU_master_plan_v2.pdf'):
              assert git('rev-parse', week3 + ':' + path) == git('rev-parse', 'HEAD:' + path), path

          broken_links = []
          for name in ['README.md', *[p for p in tracked if p.startswith('docs/') and p.endswith('.md')]]:
              text = Path(name).read_text()
              for target in re.findall(r'\]\(([^)\s]+)\)', text):
                  if '://' in target or target.startswith(('#', 'mailto:')):
                      continue
                  relative = target.split('#', 1)[0]
                  if relative and not (Path(name).parent / relative).exists():
                      broken_links.append((name, target))
          assert not broken_links, broken_links
          print(json.dumps({'verified_commit': proposed, 'week3_parent': week3,
                            'removed_note_files': len(removed), 'removed_paths': removed,
                            'research_trees_byte_identical_to_week3': True,
                            'broken_relative_markdown_links': broken_links}, indent=2))
          PY
      - name: Install the branch's pinned direct dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the full existing research test suite
        run: python -m pytest -q tests --junitxml="$RUNNER_TEMP/week3-merge-tests.xml"
      - name: Check the harness command and unchanged tracked data
        run: |
          python -m ou_irregular.runner --help
          git diff --exit-code
      - name: Record tested commit and test totals
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'week3-merge-tests.xml'
          lines = ['Tested candidate: `4513a4b1cafa88560bffef5e267b53fae2ed3fc1`.']
          if report.exists():
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
              totals = {key: sum(int(s.attrib.get(key, 0)) for s in suites)
                        for key in ('tests', 'failures', 'errors', 'skipped')}
              lines.append(str(totals))
          else:
              lines.append('Test report missing; do not claim test success.')
          print('\n'.join(lines))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n\n'.join(lines) + '\n')
          PY
